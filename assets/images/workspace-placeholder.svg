<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none" aria-label="Premium Workspace Visual Placeholder">
  <rect width="800" height="500" fill="#0F172A"/>
  <!-- Subtle architectural grid lines -->
  <line x1="100" y1="0" x2="100" y2="500" stroke="#1E293B" stroke-width="1"/>
  <line x1="300" y1="0" x2="300" y2="500" stroke="#1E293B" stroke-width="1"/>
  <line x1="500" y1="0" x2="500" y2="500" stroke="#1E293B" stroke-width="1"/>
  <line x1="700" y1="0" x2="700" y2="500" stroke="#1E293B" stroke-width="1"/>
  <line x1="0" y1="250" x2="800" y2="250" stroke="#1E293B" stroke-width="1"/>

  <!-- Perspective Floor / Room Elements -->
  <polygon points="150,420 650,420 550,220 250,220" fill="#141B2D" stroke="#C5A880" stroke-width="1.5"/>
  <polygon points="250,220 550,220 500,120 300,120" fill="#1E293B" stroke="#334155" stroke-width="1"/>

  <!-- Center Crest / Badge -->
  <circle cx="400" cy="270" r="48" fill="#0B1325" stroke="#C5A880" stroke-width="2"/>
  <text x="400" y="265" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="1">LUXURE NEST</text>
  <text x="400" y="285" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" fill="#C5A880" letter-spacing="1.5">VERIFIED SPACE</text>

  <!-- Placeholder Caption -->
  <rect x="250" y="440" width="300" height="28" rx="4" fill="#0B1325" stroke="#334155" stroke-width="1"/>
  <text x="400" y="458" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">[Workspace Photography Asset Placeholder]</text>
</svg>
